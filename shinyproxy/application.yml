    - id: portfolio_app
      port: 4004 
      display-name: Portfolio Analysis
      description: "Climate stress test against a portfolio"
      container-cmd: ["R", "-e", "shiny::runApp(host = \"0.0.0.0\", port = 4004)"]
      container-image: registry.digitalocean.com/theia-1in1000-shinyapps/app-st-portfolio:1.0
      # kubernetes-pod-patches adds the k8s secret db-credentials in the current namespace to the container's env vars
      kubernetes-pod-patches: |
        - op: add
          path: /spec/containers/0/envFrom
          value:
            - secretRef:
                name: db-credentials                         
    - id: sensitivity_app
      port: 4010
      display-name: Scenarios sensitivity Analysis
      description: "Compare trajectories between multiple runs"
      container-cmd: ["R", "-e", "shiny::runApp(host = \"0.0.0.0\", port = 4010)"]
      container-image: registry.digitalocean.com/theia-1in1000-shinyapps/app-st-sensitivity:1.0
      # kubernetes-pod-patches adds the k8s secret db-credentials in the current namespace to the container's env vars
      kubernetes-pod-patches: |
        - op: add
          path: /spec/containers/0/envFrom
          value:
            - secretRef:
                name: db-credentials      
logging:
  file:
    name: shinyproxy.log
